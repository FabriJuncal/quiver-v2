name: Factory v2.2.2 Runtime Guardrails
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Static distribution contract
        run: bash scripts/check-release.sh
      - name: Isolated lifecycle, doctor, dry-runs and runtime regressions
        run: python3 -B -m unittest discover -s tests -v
